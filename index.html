<!doctype html>
<html lang="kr">
    <head>
        <meta charset="UTF-8" />
        <title>🎱 행운의 로또</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="stylesheet" href="https://unpkg.com/modern-css-reset/dist/reset.min.css" />
        <link rel="stylesheet" href="./src/css/index.css" />
    </head>

    <body>
        <main id="app" class="p-3">
            <h1 class="text-center">🎱 행운의 로또</h1>
            <div class="d-flex justify-center mt-5">
                <div class="w-100" id="main-container">
                    <form id="input-price-form" class="mt-5" aria-labelledby="input-price">
                        <label for="input-price" class="mb-2 d-inline-block">구입할 금액을 입력해주세요.</label>
                        <div class="d-flex">
                            <input
                                type="number"
                                id="input-price"
                                class="w-100 mr-2 pl-2"
                                name="price"
                                placeholder="구입 금액"
                                required
                                min="1000"
                                max="100000"
                            />
                            <button type="submit" id="input-price-button" class="btn btn-cyan">확인</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
        <script type="module" src="./src/js/index.js"></script>
    </body>
</html>
